name: Moodle CI

on:
  pull_request:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  push:
    branches:
      - main
      - master
      - MOODLE_*_STABLE
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ci:
    uses: praxisdigital/moodle-test-action/.github/workflows/ci.yml@mma_BehatOnDemand
    secrets: inherit
    with:
      action_ref: 'mma_BehatOnDemand'
      behat_on_pull_request: 'true'